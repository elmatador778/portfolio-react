<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui,sans-serif">
<defs>
  <linearGradient id="viewportBg2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3a3d44"></stop>
    <stop offset="100%" stop-color="#22242a"></stop>
  </linearGradient>
  <radialGradient id="stressHot2" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#ff453a"></stop>
    <stop offset="40%" stop-color="#ffb340"></stop>
    <stop offset="70%" stop-color="#f2c94c"></stop>
    <stop offset="100%" stop-color="#2fbf71"></stop>
  </radialGradient>
  <linearGradient id="legendGrad2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3d8bff"></stop>
    <stop offset="35%" stop-color="#2fbf71"></stop>
    <stop offset="65%" stop-color="#f2c94c"></stop>
    <stop offset="100%" stop-color="#ff453a"></stop>
  </linearGradient>
  <linearGradient id="partTop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e8e8ea"></stop>
    <stop offset="100%" stop-color="#b4b6bc"></stop>
  </linearGradient>
  <linearGradient id="partSide" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9a9ca2"></stop>
    <stop offset="100%" stop-color="#6c6e74"></stop>
  </linearGradient>
</defs>

<rect width="800" height="600" fill="#e5e6ea"></rect>
<rect x="30" y="30" width="740" height="540" rx="10" fill="#f4f4f6" stroke="#c7c8cd" stroke-width="1.5"></rect>

<!-- title bar -->
<rect x="30" y="30" width="740" height="34" rx="10" fill="#dcdde2"></rect>
<rect x="30" y="52" width="740" height="12" fill="#dcdde2"></rect>
<circle cx="54" cy="47" r="5" fill="#c3c4ca"></circle>
<circle cx="72" cy="47" r="5" fill="#c3c4ca"></circle>
<circle cx="90" cy="47" r="5" fill="#c3c4ca"></circle>
<text x="360" y="52" font-size="12" fill="#6b6d73">harnais_ancrage_v3.cad — étude statique</text>

<!-- menu / ribbon -->
<rect x="30" y="64" width="740" height="30" fill="#eceeef"></rect>
<text x="46" y="84" font-size="12" fill="#4a4c52">Fichier</text>
<text x="102" y="84" font-size="12" fill="#4a4c52">Modélisation</text>
<text x="196" y="84" font-size="12" fill="#4a4c52">Assemblage</text>
<text x="278" y="84" font-size="12" fill="#0066cc" font-weight="600">Simulation</text>
<text x="356" y="84" font-size="12" fill="#4a4c52">Résultats</text>
<text x="428" y="84" font-size="12" fill="#4a4c52">Affichage</text>

<!-- left tool rail -->
<rect x="30" y="94" width="46" height="380" fill="#eceeef"></rect>
<g fill="none" stroke="#5a5c62" stroke-width="1.6">
  <path d="M45 112 l8 8 l0 12 l-8 -4 Z" fill="#8a8c92"></path>
  <rect x="43" y="148" width="16" height="16" rx="2"></rect>
  <circle cx="51" cy="188" r="8"></circle>
  <path d="M43 218 h16 M51 210 v16"></path>
  <path d="M43 250 q8 -12 16 0 q-8 12 -16 0 Z"></path>
</g>

<!-- viewport -->
<rect x="76" y="94" width="644" height="314" fill="url(#viewportBg2)"></rect>

<!-- axis gizmo -->
<g transform="translate(676,130)" stroke-width="2.4" stroke-linecap="round">
  <line x1="0" y1="0" x2="26" y2="0" stroke="#ff5a4e"></line>
  <line x1="0" y1="0" x2="-14" y2="16" stroke="#3dd68c"></line>
  <line x1="0" y1="0" x2="0" y2="-26" stroke="#4a86e8"></line>
</g>

<!-- exploded assembly -->
<g transform="translate(0,10)">
  <!-- buckle housing -->
  <path d="M300 140 L300 180 L360 200 L420 180 L420 140 L360 120 Z" fill="url(#partTop)" stroke="#2a2b2e" stroke-width="1"></path>
  <path d="M300 180 L360 200 L360 214 L300 194 Z" fill="url(#partSide)"></path>
  <path d="M420 180 L360 200 L360 214 L420 194 Z" fill="url(#partSide)"></path>

  <line x1="360" y1="214" x2="360" y2="256" stroke="#7a7c82" stroke-width="1.5" stroke-dasharray="5 4"></line>

  <!-- latch plate -->
  <path d="M320 258 L320 282 L360 296 L400 282 L400 258 L360 244 Z" fill="url(#partTop)" stroke="#2a2b2e" stroke-width="1"></path>
  <path d="M320 282 L360 296 L360 306 L320 292 Z" fill="url(#partSide)"></path>
  <path d="M400 282 L360 296 L360 306 L400 292 Z" fill="url(#partSide)"></path>

  <line x1="360" y1="306" x2="360" y2="340" stroke="#7a7c82" stroke-width="1.5" stroke-dasharray="5 4"></line>

  <!-- anchor pin with stress overlay -->
  <circle cx="360" cy="368" r="30" fill="url(#partTop)" stroke="#2a2b2e" stroke-width="1"></circle>
  <circle cx="360" cy="368" r="30" fill="url(#stressHot2)" opacity="0.85"></circle>
  <circle cx="360" cy="368" r="8" fill="#1a1b1e"></circle>
</g>

<!-- secondary anchors -->
<circle cx="180" cy="330" r="16" fill="url(#stressHot2)" opacity="0.55"></circle>
<circle cx="180" cy="330" r="16" fill="none" stroke="#e5e6ea" stroke-width="1.5"></circle>
<circle cx="560" cy="330" r="12" fill="url(#stressHot2)" opacity="0.35"></circle>
<circle cx="560" cy="330" r="12" fill="none" stroke="#e5e6ea" stroke-width="1.5"></circle>

<text x="440" y="150" font-size="12" fill="#e5e6ea" font-weight="600">Corps de boucle</text>
<text x="440" y="166" font-size="10" fill="#a9abb1">acier inox — emboutissage</text>
<text x="440" y="268" font-size="12" fill="#e5e6ea" font-weight="600">Platine de verrouillage</text>
<text x="440" y="284" font-size="10" fill="#a9abb1">languette + ressort de rappel</text>
<text x="410" y="372" font-size="12" fill="#e5e6ea" font-weight="600">Point d'ancrage</text>
<text x="410" y="388" font-size="10" fill="#a9abb1">contrainte maximale simulée</text>
<text x="100" y="380" font-size="10" fill="#a9abb1">ancrage latéral G</text>
<text x="520" y="380" font-size="10" fill="#a9abb1">ancrage latéral D</text>

<!-- feature timeline -->
<rect x="76" y="408" width="644" height="30" fill="#eceeef"></rect>
<line x1="96" y1="423" x2="700" y2="423" stroke="#c7c8cd" stroke-width="2"></line>
<g fill="#ffffff" stroke="#0066cc" stroke-width="2">
  <circle cx="120" cy="423" r="6"></circle>
  <circle cx="220" cy="423" r="6"></circle>
  <circle cx="320" cy="423" r="6"></circle>
</g>
<circle cx="420" cy="423" r="6" fill="#0066cc" stroke="#0066cc" stroke-width="2"></circle>

<!-- legend -->
<rect x="76" y="450" width="644" height="70" fill="#eceeef"></rect>
<text x="96" y="470" font-size="11" fill="#4a4c52">Contrainte de Von Mises simulée</text>
<rect x="96" y="480" width="260" height="14" rx="7" fill="url(#legendGrad2)"></rect>
<text x="90" y="510" font-size="10" fill="#7a7c82" text-anchor="end">0</text>
<text x="360" y="510" font-size="10" fill="#7a7c82">σ max ≈ 640 MPa</text>
<text x="440" y="470" font-size="11" fill="#4a4c52">Coefficient de sécurité : 3.2</text>
<text x="440" y="490" font-size="11" fill="#4a4c52">Charge appliquée : 22 kN</text>
<text x="440" y="510" font-size="11" fill="#4a4c52">Maillage : 84 210 éléments</text>

<text x="30" y="576" font-size="18" fill="#7a7a7a">Assemblage éclaté et analyse numérique — boucle d'ancrage du harnais</text>
</svg>

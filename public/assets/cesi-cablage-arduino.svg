<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui,sans-serif">
<defs>
  <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0f6e4f"></stop>
    <stop offset="100%" stop-color="#0a5a41"></stop>
  </linearGradient>
  <linearGradient id="bbGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"></stop>
    <stop offset="100%" stop-color="#f0f0f0"></stop>
  </linearGradient>
  <radialGradient id="capGrad" cx="35%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#e5e5e5"></stop>
    <stop offset="100%" stop-color="#9a9a9a"></stop>
  </radialGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.18"></feDropShadow>
  </filter>
</defs>
<rect width="800" height="600" fill="#f3f4f7"></rect>

<!-- breadboard -->
<g filter="url(#softShadow)">
  <rect x="70" y="200" width="330" height="220" rx="10" fill="url(#bbGrad)" stroke="#d0d0d0" stroke-width="1.5"></rect>
</g>
<rect x="70" y="222" width="330" height="14" fill="#ff6b5e" opacity="0.55"></rect>
<rect x="70" y="392" width="330" height="14" fill="#4a86e8" opacity="0.55"></rect>
<g fill="#c9c9c9">
  <!-- breadboard hole grid -->
</g>
<g fill="#bdbdbd">
  <g id="bbrow"></g>
</g>
<!-- procedurally-styled hole rows -->
<g fill="#c4c4c4">
  <!-- top power rail holes -->
  <circle cx="90" cy="229" r="2.4"></circle><circle cx="106" cy="229" r="2.4"></circle><circle cx="122" cy="229" r="2.4"></circle><circle cx="138" cy="229" r="2.4"></circle><circle cx="154" cy="229" r="2.4"></circle><circle cx="170" cy="229" r="2.4"></circle><circle cx="186" cy="229" r="2.4"></circle><circle cx="202" cy="229" r="2.4"></circle><circle cx="218" cy="229" r="2.4"></circle><circle cx="234" cy="229" r="2.4"></circle><circle cx="250" cy="229" r="2.4"></circle><circle cx="266" cy="229" r="2.4"></circle><circle cx="282" cy="229" r="2.4"></circle><circle cx="298" cy="229" r="2.4"></circle><circle cx="314" cy="229" r="2.4"></circle><circle cx="330" cy="229" r="2.4"></circle><circle cx="346" cy="229" r="2.4"></circle><circle cx="362" cy="229" r="2.4"></circle><circle cx="378" cy="229" r="2.4"></circle>
</g>
<g fill="#b7c3d6" opacity="0.9">
  <!-- main matrix rows, 8 rows x 19 cols, sparse for readability -->
</g>
<g stroke="#d6d6d6" stroke-width="1" fill="none">
  <line x1="70" y1="260" x2="400" y2="260"></line>
  <line x1="70" y1="310" x2="400" y2="310"></line>
  <line x1="70" y1="360" x2="400" y2="360"></line>
</g>
<g fill="#c4c4c4">
  <g transform="translate(0,0)">
    <!-- five sample columns of holes to suggest matrix -->
  </g>
</g>
<!-- generate a light dot matrix via repeated small circles -->
<g fill="#c9c9c9">
  <g>
    <circle cx="96" cy="250" r="2"></circle><circle cx="96" cy="264" r="2"></circle><circle cx="96" cy="278" r="2"></circle><circle cx="96" cy="292" r="2"></circle><circle cx="96" cy="306" r="2"></circle>
    <circle cx="96" cy="322" r="2"></circle><circle cx="96" cy="336" r="2"></circle><circle cx="96" cy="350" r="2"></circle><circle cx="96" cy="364" r="2"></circle><circle cx="96" cy="378" r="2"></circle>
  </g>
  <g transform="translate(24,0)"><circle cx="96" cy="250" r="2"></circle><circle cx="96" cy="264" r="2"></circle><circle cx="96" cy="278" r="2"></circle><circle cx="96" cy="292" r="2"></circle><circle cx="96" cy="306" r="2"></circle><circle cx="96" cy="322" r="2"></circle><circle cx="96" cy="336" r="2"></circle><circle cx="96" cy="350" r="2"></circle><circle cx="96" cy="364" r="2"></circle><circle cx="96" cy="378" r="2"></circle></g>
  <g transform="translate(48,0)"><circle cx="96" cy="250" r="2"></circle><circle cx="96" cy="264" r="2"></circle><circle cx="96" cy="278" r="2"></circle><circle cx="96" cy="292" r="2"></circle><circle cx="96" cy="306" r="2"></circle><circle cx="96" cy="322" r="2"></circle><circle cx="96" cy="336" r="2"></circle><circle cx="96" cy="350" r="2"></circle><circle cx="96" cy="364" r="2"></circle><circle cx="96" cy="378" r="2"></circle></g>
  <g transform="translate(72,0)"><circle cx="96" cy="250" r="2"></circle><circle cx="96" cy="264" r="2"></circle><circle cx="96" cy="278" r="2"></circle><circle cx="96" cy="292" r="2"></circle><circle cx="96" cy="306" r="2"></circle><circle cx="96" cy="322" r="2"></circle><circle cx="96" cy="336" r="2"></circle><circle cx="96" cy="350" r="2"></circle><circle cx="96" cy="364" r="2"></circle><circle cx="96" cy="378" r="2"></circle></g>
  <g transform="translate(120,0)"><circle cx="96" cy="250" r="2"></circle><circle cx="96" cy="264" r="2"></circle><circle cx="96" cy="278" r="2"></circle><circle cx="96" cy="292" r="2"></circle><circle cx="96" cy="306" r="2"></circle><circle cx="96" cy="322" r="2"></circle><circle cx="96" cy="336" r="2"></circle><circle cx="96" cy="350" r="2"></circle><circle cx="96" cy="364" r="2"></circle><circle cx="96" cy="378" r="2"></circle></g>
  <g transform="translate(168,0)"><circle cx="96" cy="250" r="2"></circle><circle cx="96" cy="264" r="2"></circle><circle cx="96" cy="278" r="2"></circle><circle cx="96" cy="292" r="2"></circle><circle cx="96" cy="306" r="2"></circle><circle cx="96" cy="322" r="2"></circle><circle cx="96" cy="336" r="2"></circle><circle cx="96" cy="350" r="2"></circle><circle cx="96" cy="364" r="2"></circle><circle cx="96" cy="378" r="2"></circle></g>
  <g transform="translate(216,0)"><circle cx="96" cy="250" r="2"></circle><circle cx="96" cy="264" r="2"></circle><circle cx="96" cy="278" r="2"></circle><circle cx="96" cy="292" r="2"></circle><circle cx="96" cy="306" r="2"></circle><circle cx="96" cy="322" r="2"></circle><circle cx="96" cy="336" r="2"></circle><circle cx="96" cy="350" r="2"></circle><circle cx="96" cy="364" r="2"></circle><circle cx="96" cy="378" r="2"></circle></g>
</g>

<!-- microcontroller mounted on breadboard -->
<rect x="150" y="260" width="150" height="60" rx="4" fill="#0a5a41" filter="url(#softShadow)"></rect>
<g fill="#c9a13b">
  <rect x="158" y="253" width="6" height="10"></rect><rect x="172" y="253" width="6" height="10"></rect><rect x="186" y="253" width="6" height="10"></rect><rect x="200" y="253" width="6" height="10"></rect><rect x="214" y="253" width="6" height="10"></rect><rect x="228" y="253" width="6" height="10"></rect><rect x="242" y="253" width="6" height="10"></rect><rect x="256" y="253" width="6" height="10"></rect><rect x="270" y="253" width="6" height="10"></rect><rect x="284" y="253" width="6" height="10"></rect>
  <rect x="158" y="317" width="6" height="10"></rect><rect x="172" y="317" width="6" height="10"></rect><rect x="186" y="317" width="6" height="10"></rect><rect x="200" y="317" width="6" height="10"></rect><rect x="214" y="317" width="6" height="10"></rect><rect x="228" y="317" width="6" height="10"></rect><rect x="242" y="317" width="6" height="10"></rect><rect x="256" y="317" width="6" height="10"></rect><rect x="270" y="317" width="6" height="10"></rect><rect x="284" y="317" width="6" height="10"></rect>

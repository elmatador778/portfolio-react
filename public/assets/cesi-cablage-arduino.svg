<rect x="160" y="268" width="30" height="30" rx="2" fill="#1d1d1f"></rect>
<text x="203" y="296" font-size="12" fill="#ffffff" font-weight="600">MCU</text>

<!-- Arduino Uno board -->
<g filter="url(#softShadow)">
  <rect x="470" y="330" width="260" height="180" rx="10" fill="url(#boardGrad)"></rect>
</g>
<rect x="470" y="330" width="260" height="180" rx="10" fill="none" stroke="#083f2e" stroke-width="1.5"></rect>
<text x="500" y="370" font-size="22" fill="#ffffff" font-weight="700" letter-spacing="1">ARDUINO</text>
<text x="500" y="392" font-size="16" fill="#dfe9e5">UNO R3</text>
<circle cx="700" cy="352" r="10" fill="#c94a3d"></circle>
<rect x="480" y="480" width="34" height="20" rx="3" fill="#c9a13b"></rect>
<text x="486" y="475" font-size="10" fill="#dfe9e5">USB</text>
<rect x="690" y="470" width="26" height="30" rx="4" fill="#1d1d1f"></rect>
<g fill="#c9a13b">
  <rect x="540" y="332" width="6" height="12"></rect><rect x="554" y="332" width="6" height="12"></rect><rect x="568" y="332" width="6" height="12"></rect><rect x="582" y="332" width="6" height="12"></rect><rect x="596" y="332" width="6" height="12"></rect><rect x="610" y="332" width="6" height="12"></rect><rect x="624" y="332" width="6" height="12"></rect><rect x="638" y="332" width="6" height="12"></rect>
  <rect x="540" y="496" width="6" height="12"></rect><rect x="554" y="496" width="6" height="12"></rect><rect x="568" y="496" width="6" height="12"></rect><rect x="582" y="496" width="6" height="12"></rect><rect x="596" y="496" width="6" height="12"></rect><rect x="610" y="496" width="6" height="12"></rect><rect x="624" y="496" width="6" height="12"></rect><rect x="638" y="496" width="6" height="12"></rect>

<!-- HC-SR04 ultrasonic sensor -->
<g filter="url(#softShadow)">
  <rect x="500" y="120" width="220" height="110" rx="10" fill="#1f8a5c"></rect>
</g>
<circle cx="558" cy="175" r="34" fill="url(#capGrad)" stroke="#7a7a7a" stroke-width="1.5"></circle>
<circle cx="558" cy="175" r="22" fill="#c9c9c9" stroke="#8a8a8a" stroke-width="1"></circle>
<circle cx="558" cy="175" r="10" fill="#9a9a9a"></circle>
<circle cx="660" cy="175" r="34" fill="url(#capGrad)" stroke="#7a7a7a" stroke-width="1.5"></circle>
